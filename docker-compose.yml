services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    ports:
      - "8000:8000"

    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      APP_NAME: Enterprise AI Assistant
      APP_ENVIRONMENT: production
      DEBUG: "false"

    volumes:
      - chroma_data:/app/chroma_db

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    ports:
      - "8501:8501"

    environment:
      API_URL: http://backend:8000

    depends_on:
      - backend

    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.backend

    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      APP_NAME: Enterprise AI Assistant
      APP_ENVIRONMENT: production
      DEBUG: "false"

    volumes:
      - chroma_data:/app/chroma_db

    command:
      - python
      - -m
      - rag.ingest

    profiles:
      - tools

volumes:
  chroma_data:
